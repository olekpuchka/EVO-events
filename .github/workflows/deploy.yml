name: Deploy

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

# `git push --follow-tags` fires both triggers at once, and a merge can land while an
# earlier deploy is still running. Serialize instead of cancelling: pushing the same
# (or a newer) HEAD twice is a no-op, but a half-finished deploy is not.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Typecheck
        run: |
          npm ci
          npm run typecheck

      - name: Deploy to JustRunMy.App
        run: |
          set -o pipefail
          # git push exits 0 even when JustRunMy.App rejects the build/schedule —
          # the remote accepts the branch at the protocol level and reports failures
          # only as text (e.g. "No matching nodes"). Capture the output and fail the
          # step if the remote printed its error banner, so the run goes red.
          if ! output=$(git push "${{ secrets.JUSTRUNMY_DEPLOY_URL }}" HEAD:refs/heads/deploy 2>&1); then
            echo "$output"
            echo "::error::git push to JustRunMy.App failed"
            exit 1
          fi
          echo "$output"
          if echo "$output" | grep -qiE 'Error processing git push|No matching nodes'; then
            echo "::error::JustRunMy.App rejected the deploy (see remote output above)"
            exit 1
          fi
