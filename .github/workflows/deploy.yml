name: Deploy

on:
  push:
    branches:
      - main
  # Re-deploy an arbitrary ref (e.g. a v* tag, to roll back) from the Actions tab.
  workflow_dispatch:

# Deliberately NOT triggered by `v*` tags. JustRunMy.App rebuilds and restarts on every
# push to its git remote — it never fast-forwards, so a second push of the *same* commit
# is a full second deploy, not a no-op. With a tag trigger, `git push --follow-tags` fired
# both triggers and restarted the bot twice for one release. Push-to-main is the only
# automatic deploy; tags are just version markers.
#
# Still serialize rather than cancel: a merge can land while a dispatch is mid-flight, and
# a half-finished deploy is worse than a queued one.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Typecheck
        run: |
          npm ci
          npm run typecheck

      - name: Deploy to JustRunMy.App
        run: |
          set -o pipefail
          # git push exits 0 even when JustRunMy.App rejects the build/schedule —
          # the remote accepts the branch at the protocol level and reports failures
          # only as text (e.g. "No matching nodes"). Capture the output and fail the
          # step if the remote printed its error banner, so the run goes red.
          if ! output=$(git push "${{ secrets.JUSTRUNMY_DEPLOY_URL }}" HEAD:refs/heads/deploy 2>&1); then
            echo "$output"
            echo "::error::git push to JustRunMy.App failed"
            exit 1
          fi
          echo "$output"
          if echo "$output" | grep -qiE 'Error processing git push|No matching nodes'; then
            echo "::error::JustRunMy.App rejected the deploy (see remote output above)"
            exit 1
          fi
