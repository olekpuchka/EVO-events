name: Deploy

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Create GitHub Release
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          RANGE="${PREV_TAG:+${PREV_TAG}..}HEAD"

          FEATS=$(git log $RANGE --pretty=format:"%s" | grep "^feat:" | sed 's/^feat: /- /' || true)
          FIXES=$(git log $RANGE --pretty=format:"%s" | grep "^fix:"  | sed 's/^fix: /- /'  || true)

          NOTES=""
          if [ -n "$FEATS" ]; then
            NOTES+="## What's new"$'\n\n'"$FEATS"$'\n\n'
          fi
          if [ -n "$FIXES" ]; then
            NOTES+="## Fixes"$'\n\n'"$FIXES"$'\n\n'
          fi
          if [ -z "$NOTES" ]; then
            NOTES=$(git log $RANGE --pretty=format:"- %s")
          fi

          printf '%s' "$NOTES" > /tmp/release-notes.md
          gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --notes-file /tmp/release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to JustRunMy.App
        run: git push "${{ secrets.JUSTRUNMY_DEPLOY_URL }}" HEAD:refs/heads/deploy
